[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-prediction"
version = "0.1.0"
description = "EPL match prediction MVP: Dixon-Coles football model, de-vigged market model, log-opinion-pool ensemble."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "responses>=0.25,<0.26",
]

[project.scripts]
epl = "epl_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epl_prediction = ["schema.sql", "team_names.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
